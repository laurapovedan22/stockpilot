[project]
name = "stockpilot"
version = "0.1.0"
description = "Explainable inventory decision support"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.38,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1", "pandas>=2.2,<3", "numpy>=2.2,<3",
  "scikit-learn>=1.6,<2", "xgboost>=3.0,<4", "joblib>=1.4,<2",
  "openpyxl>=3.1,<4", "httpx>=0.28,<1", "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "mypy>=1.15,<2", "pandas-stubs>=2.2,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires migrated PostgreSQL via TEST_DATABASE_URL"]
