name: stockpilot
x-backend: &backend
  build: ./backend
  environment: &environment
    DATABASE_URL: postgresql+psycopg://stockpilot:stockpilot@db:5432/stockpilot
    APP_MODE: ${APP_MODE:-local}
    ARTIFACT_DIR: /app/artifacts
    UPLOAD_DIR: /app/uploads
    AI_ENABLED: ${AI_ENABLED:-false}
    AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
    OPENAI_MODEL: ${OPENAI_MODEL:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  volumes:
    - artifacts:/app/artifacts
    - uploads:/app/uploads
    - ./data:/app/data
    - ./docs/policies:/app/docs/policies:ro
services:
  db:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: stockpilot
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U stockpilot -d stockpilot']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    ports: ['127.0.0.1:${API_PORT:-8000}:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      retries: 10
  worker:
    <<: *backend
    command: [python, -m, stockpilot.worker.main]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: ./frontend
    ports: ['127.0.0.1:${WEB_PORT:-5173}:80']
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres:
  artifacts:
  uploads:
